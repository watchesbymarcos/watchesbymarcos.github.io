<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watches by Marcos</title>
<meta name="description" content="Relojes Citizen, Orient y Seiko. Consultas y pedidos por WhatsApp.">
<meta property="og:title" content="Watches by Marcos">
<meta property="og:description" content="Relojes Citizen, Orient y Seiko. Consultas y pedidos por WhatsApp.">
<meta name="theme-color" content="#0a2c1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a2c1f'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23b8995a' stroke-width='3.5'/%3E%3Cpath d='M25 15V8h14v7M25 49v7h14v-7' fill='none' stroke='%23b8995a' stroke-width='3'/%3E%3Cpath d='M32 32l-6-3.5M32 32l9-6' stroke='%23b8995a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Tienda estilo streetwear: barras negras de promos, logo centrado, hero grande con título gigante, grilla de producto densa */
:root{
  --ink:#111412; --paper:#ffffff; --mist:#f2efe6; --line:#e2ded3; --muted:#6b6a62;
  --green:#0f4a32; --green-d:#0a2c1f; --cream:#f4efe2; --gold:#b8995a;
  --accent:#b8995a; --sale:#8e2a22; --ok:#0f4a32;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --serif:"Cormorant Garamond","Times New Roman",serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--green-d)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}

/* marquee */
.marq{background:var(--green-d);color:var(--cream);overflow:hidden;white-space:nowrap;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.marq{position:relative}
.marq-track{display:inline-flex;gap:0;padding-block:10px;animation:marq 38s linear infinite;animation-play-state:running;will-change:transform;transform:translate3d(0,0,0)}
.marq-track span{padding-right:.6em}
.marq-track span::after{content:"·";padding-left:.6em;color:var(--gold)}
@keyframes marq{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.band{background:var(--green);color:var(--cream);border-block:1px solid var(--gold)}
.band .marq-track{animation-duration:30s;padding-block:12px;font-size:14px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line);color:var(--green-d)}
.hbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:12px}
.hbtn{background:none;border:0;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;display:inline-flex;align-items:center;gap:8px}
.hbtn.right{justify-self:end;position:relative}
.count{position:absolute;top:-4px;right:-14px;background:var(--green-d);color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.logo{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;background:none;border:0;padding:0;color:var(--green-d)}
.logo svg,.logo img{width:70px;height:70px;object-fit:contain}
.logo b{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.24em;line-height:1}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(110% 85% at 50% 32%,#17603f 0%,var(--green) 38%,var(--green-d) 82%);color:var(--cream)}
.slides{display:flex;transition:transform .6s cubic-bezier(.6,0,.2,1)}
.slide{flex:0 0 100%;position:relative;aspect-ratio:4/5;max-height:760px;width:100%;display:grid;place-items:center;overflow:hidden}
@media (min-width:800px){.slide{aspect-ratio:16/8}}
.slide .art{position:absolute;inset:0;display:grid;place-items:center}
.slide .art svg{height:78%;width:auto;max-width:90%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.slide .shade{position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(6,26,18,.6))}
.slide .txt{position:absolute;left:0;right:0;bottom:0;padding-bottom:18px;text-align:center}
.slide .sub{font-weight:600;letter-spacing:.24em;text-transform:uppercase;font-size:13px;margin-bottom:6px;color:var(--gold)}
.slide h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,17vw,220px);line-height:.86;margin:0;letter-spacing:.01em;text-wrap:balance}
/* portada: la foto se funde con el verde */
.slide .blur{position:absolute;inset:-60px;width:calc(100% + 120px);height:calc(100% + 120px);max-width:none;object-fit:cover;filter:blur(36px) saturate(.4) brightness(.6);opacity:.45;mix-blend-mode:luminosity}
.slide .ph{position:absolute;left:0;top:0;width:100%;height:84%;object-fit:cover;object-position:center 42%;-webkit-mask-image:linear-gradient(#000 55%,transparent 100%);mask-image:linear-gradient(#000 55%,transparent 100%)}
.slide .ph~.shade{height:45%;background:linear-gradient(transparent,rgba(6,26,18,.75))}
@media (max-width:799px){.slide .art{place-items:start center;padding-top:12%}.slide .art svg{height:58%}}
@media (min-width:800px){
  .slide .ph{left:auto;right:0;width:60%;height:100%;object-position:center 45%;filter:brightness(.94);-webkit-mask-image:linear-gradient(90deg,transparent,#000 42%),linear-gradient(transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 42%),linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-composite:intersect}
  .slide .art{left:auto;right:3%;width:50%}
  .slide .shade,.slide .ph~.shade{inset:0;height:100%;background:linear-gradient(90deg,rgba(6,26,18,.5),transparent 55%)}
  .slide .txt{top:50%;bottom:auto;transform:translateY(-50%);right:50%;text-align:left;padding-bottom:0;padding-left:max(56px,env(safe-area-inset-left,0px))}
  .slide h1{font-size:clamp(72px,10vw,168px)}
}
.harrow{position:absolute;top:16px;display:flex;gap:18px;right:max(16px,env(safe-area-inset-right,0px));z-index:3}
.harrow button{background:none;border:0;color:var(--cream);font-size:30px;line-height:1;padding:4px}
.hcta{margin-top:16px;background:transparent;border:1px solid var(--gold);color:var(--cream);padding:12px 24px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;min-height:44px;transition:background .2s,color .2s}
.hcta:hover{background:var(--gold);color:var(--green-d)}
.hero::before{content:"";position:absolute;inset:0 0 auto;height:96px;background:linear-gradient(rgba(6,26,18,.6),transparent);z-index:2;pointer-events:none}
.hcount{position:absolute;left:0;right:0;top:16px;text-align:center;font-size:15px;letter-spacing:.1em;z-index:3;font-variant-numeric:tabular-nums}

/* shop */
.shop{padding-block:40px 24px}
.shead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
.shead h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,56px);line-height:1;margin:0;letter-spacing:.01em;color:var(--green-d)}
.search{flex:1 1 220px;max-width:340px;border:1px solid var(--ink);padding:10px 12px;font:inherit;background:var(--paper);border-radius:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--green-d);color:var(--green-d);background:var(--paper);padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--green-d);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1080px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.pimg{position:relative;aspect-ratio:1/1;background:var(--mist);overflow:hidden;border:0;padding:0;width:100%;display:block}
.pimg img,.pimg svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.pimg svg{object-fit:contain;padding:8%}
.card:hover .pimg img,.card:hover .pimg svg{transform:scale(1.04)}
.tag{position:absolute;top:8px;left:8px;background:var(--green-d);color:#fff;font-size:11px;font-weight:700;padding:4px 7px;letter-spacing:.05em}
.tag.sale{background:var(--sale)}
.tag.r{left:auto;right:8px;background:var(--paper);color:var(--muted);border:1px solid var(--line);font-weight:600}
.tag.out{top:auto;bottom:8px;background:#fff;color:var(--ink);border:1px solid var(--ink)}
.pname{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0;line-height:1.3;overflow-wrap:anywhere}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.price b{font-size:17px}
.price s{color:var(--muted);font-size:13px}
.cash{font-size:13px;color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.cuo{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{margin-top:4px;background:var(--green-d);color:var(--cream);border:0;padding:11px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.add[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed}
.empty{padding:40px 0;color:var(--muted);text-align:center}

/* benefits */
.bens{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border-block:1px solid var(--line);margin-top:30px}
.ben{background:var(--paper);padding:24px 20px;display:flex;gap:14px;align-items:flex-start}
.ben svg{flex:none;width:30px;height:30px;color:var(--gold)}
.ben h3{margin:0 0 3px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.ben p{margin:0;color:var(--muted);font-size:14px}

/* footer */
footer{background:var(--green-d);color:#d9d6cb;margin-top:0;border-top:1px solid var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px;padding-block:44px 28px}
footer h4{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;color:var(--gold)}
footer p,footer li{margin:0 0 6px;font-size:14px}
footer ul{list-style:none;padding:0;margin:0}
footer .logo svg{width:84px;height:84px}
footer .logo{align-items:flex-start;color:var(--gold)}
.copy{border-top:1px solid rgba(184,153,90,.3);padding-block:16px;font-size:12px;color:#9a9a8c;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.igb{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:9px;background:var(--green);color:var(--cream);border:1px solid rgba(184,153,90,.55);transition:background .2s,color .2s}
.igb svg{width:18px;height:18px}
.igl{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.igl:hover .igb{background:var(--gold);color:var(--green-d)}
footer li.igrow{margin:4px 0 10px}
.menu a.igm{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu a.igm .igb{background:var(--green-d)}
.msub{border-bottom:1px solid var(--line)}
.msub>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.msub>summary::-webkit-details-marker{display:none}
.msub>summary::after{content:"+";font-size:22px;line-height:1;color:var(--gold)}
.msub[open]>summary::after{content:"−"}
.menu .msub a.igm{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:10px 0 10px 16px;font-size:15px;line-height:1;border-bottom:0;border-top:1px solid var(--line)}
.msub[open]{padding-bottom:6px}
.adminlink{background:none;border:1px solid rgba(184,153,90,.5);color:var(--gold);padding:6px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* whatsapp */
.wa{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:40}
.wa svg{width:32px;height:32px}

/* drawers & modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70}
.drawer{position:fixed;top:0;bottom:0;width:min(420px,100%);background:var(--paper);z-index:80;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.l{left:0;padding-left:env(safe-area-inset-left,0px)}
.drawer.r{right:0;padding-right:env(safe-area-inset-right,0px)}
.drawer.wide{width:min(560px,100%)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em}
.x{background:none;border:0;font-size:26px;line-height:1;padding:4px 8px}
.dbody{flex:1;overflow-y:auto;padding:16px 18px}
.dfoot{border-top:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.menu a,.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 0;font-size:16px;text-transform:uppercase;letter-spacing:.05em;text-decoration:none}
.citem{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.citem .th{width:72px;height:72px;background:var(--mist);overflow:hidden}
.citem .th img,.citem .th svg{width:100%;height:100%;object-fit:cover}
.qty{display:inline-flex;border:1px solid var(--line);margin-top:6px}
.qty button{background:none;border:0;width:30px;height:28px}
.qty span{min-width:26px;text-align:center;line-height:28px;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.big{background:var(--green-d);color:var(--cream);border:0;padding:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;text-decoration:none;display:block}
.big.wa2{background:#1d8f4e}
.ghost{background:var(--paper);border:1px solid var(--green-d);color:var(--green-d);padding:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.modal{position:fixed;z-index:80;inset:auto 0 0 0;max-height:92%;overflow-y:auto;background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:860px){.modal{inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(900px,92vw);max-height:88vh}}
.mgrid{display:grid;grid-template-columns:1fr;gap:0}
@media (min-width:860px){.mgrid{grid-template-columns:1fr 1fr}}
.mimg{background:var(--mist);aspect-ratio:1/1}
.mimg img,.mimg svg{width:100%;height:100%;object-fit:cover}
.mimg svg{object-fit:contain;padding:10%}
.minfo{padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.minfo h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.02;margin:0;letter-spacing:.01em;text-wrap:balance;color:var(--green-d)}
.minfo .x{position:absolute;top:10px;right:10px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.desc{color:#3a3834;white-space:pre-line}
.paylist{border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--green-d);color:var(--cream);padding:12px 18px;font-size:14px;z-index:95;max-width:calc(100% - 32px)}

/* admin */
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 10px;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fld small{color:var(--muted);font-size:12px}
.fld input,.fld textarea,.fld select{font:inherit;border:1px solid #c9c6bf;padding:9px 10px;background:#fff;border-radius:0;width:100%;min-width:0}
.fld textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{background:var(--mist);border-left:3px solid var(--accent);padding:10px 12px;font-size:13px;margin-bottom:14px}
.item{border:1px solid var(--line);margin-bottom:10px}
.item>summary{list-style:none;display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 10px;cursor:pointer}
.item>summary::-webkit-details-marker{display:none}
.item .th{width:48px;height:48px;background:var(--mist);overflow:hidden}
.item .th img,.item .th svg{width:100%;height:100%;object-fit:cover}
.item .ib{padding:12px 10px 4px;border-top:1px solid var(--line)}
.item .nm{font-weight:700;font-size:13px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:12px;color:var(--muted)}
.iact{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.mini{background:#fff;border:1px solid #c9c6bf;padding:6px 10px;font-size:12px;font-weight:600}
.mini.del{color:var(--sale);border-color:var(--sale)}
.status{font-size:13px;min-height:1.2em}
.status.err{color:var(--sale)}
.status.ok{color:var(--ok)}
/* móviles (Android / iOS) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,summary{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea,.search{font-size:16px!important}
.qty button{width:40px;height:38px;font-size:18px}
.qty span{line-height:38px}
.x{min-width:44px;min-height:44px}
.drawer{height:100%;height:100dvh;overscroll-behavior:contain}
.dbody,.modal{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (hover:none){.card:hover .pimg img,.card:hover .pimg svg{transform:none}}
@media (max-width:420px){.hbtn{font-size:14px;gap:6px}.logo svg,.logo img{width:58px;height:58px}.logo b{font-size:12px;letter-spacing:.18em}.price b{font-size:15px}.add{padding:12px 6px;font-size:11px}}
/* portada minimalista */
.hero{background:var(--green-d)}
.hero::before,.slide .blur,.slide .shade,.hcount,.harrow{display:none}
.slide .sub{font-size:11px;letter-spacing:.32em;margin-bottom:12px}
.slide h1{font-size:clamp(52px,14vw,96px);line-height:.9}
.slide .txt{padding-bottom:44px}
.hcta{margin-top:22px;background:none;border:0;border-bottom:1px solid var(--gold);padding:8px 0;min-height:0;font-size:12px;letter-spacing:.2em}
.hcta::after{content:"\00a0\00a0\2192"}
.hcta:hover{background:none;color:var(--gold)}
.hdots{position:absolute;z-index:3;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:10px}
.hdots button{position:relative;width:24px;height:2px;padding:0;border:0;background:rgba(244,239,226,.3);transition:background .3s,width .3s}
.hdots button::before{content:"";position:absolute;inset:-12px -4px}
.hdots button[aria-current="true"]{background:var(--gold);width:36px}
@media (min-width:800px){
  .slide .ph{width:55%;filter:none}
  .slide .txt{padding-bottom:0}
  .slide h1{font-size:clamp(56px,7vw,112px)}
  .hdots{left:max(56px,env(safe-area-inset-left,0px));right:auto;bottom:32px;justify-content:flex-start}
}

function watchSVG(o){

    '<g class="mh" transform="rotate(60 100 130)"><rect x="98" y="84" width="4" height="50" rx="2" fill="'+mark+'"/></g>'+

}

(function(){

function renderAll(){ renderRest(); renderHero(); renderChips(); renderGrid(); }

/* ---------- layers ---------- */
function layer(html){
  var L = $("#layer"); L.innerHTML = '<div class="scrim" id="scrim"></div>' + html;
  $("#scrim").onclick = closeLayer;
  document.body.style.overflow = "hidden";
  var x = L.querySelector(".x"); if (x) { x.onclick = closeLayer; x.focus(); }
}
function closeLayer(){
  if (adminOpen && dirty){ adminWarn(); return; }
  $("#layer").innerHTML = ""; document.body.style.overflow = ""; adminOpen = false;
}
document.addEventListener("keydown", function(e){ if (e.key==="Escape" && $("#layer") && $("#layer").innerHTML) closeLayer(); });
function toast(t){ var d = document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2200); }

function openMenu(){
  layer('<aside class="drawer l" role="dialog" aria-label="Menú"><div class="dhead"><h3>Menú</h3><button class="x" aria-label="Cerrar">&times;</button></div><nav class="dbody menu">'+
    '<button data-mc="Todos">Todos los relojes</button>'+(S.categories||[]).map(function(c){ return '<button data-mc="'+esc(c)+'">'+esc(c)+'</button>'; }).join("")+
    ((igLink() || waNum()) ? '<details class="msub"><summary>Contacto</summary>'+
      (igLink() ? '<a class="igm" href="'+esc(igLink())+'" target="_blank" rel="noopener"><span>Instagram</span>'+igBadge()+'</a>' : '')+
      (waNum() ? '<a class="igm" href="'+esc(waLink("Hola! Vengo de la web."))+'" target="_blank" rel="noopener"><span>WhatsApp</span>'+waBadge()+'</a>' : '')+
    '</details>' : '')+
    (canEdit ? '<button id="mAdmin">Administrar tienda</button>' : '')+
  '</nav></aside>');
  document.querySelectorAll("[data-mc]").forEach(function(b){ b.onclick = function(){ view.cat = b.dataset.mc; closeLayer(); renderChips(); renderGrid(); $("#shop").scrollIntoView({behavior:"smooth"}); }; });
  if (canEdit) $("#mAdmin").onclick = function(){ closeLayer(); openAdmin(); };
}

function openProduct(id){
  var p = S.products.find(function(x){ return x.id===id; }); if (!p) return;
  var o = off(p), n = Number(S.pay.cuotas)||0;
  layer('<div class="modal" role="dialog" aria-label="'+esc(p.name)+'"><div class="mgrid"><div class="mimg">'+pImg(p)+'</div><div class="minfo"><button class="x" aria-label="Cerrar">&times;</button>'+
    '<div class="kicker">'+esc(p.cat)+(p.example?' · Ejemplo':'')+'</div><h2>'+esc(p.name)+'</h2>'+
    '<div class="price"><b style="font-size:24px">'+money(p.price)+'</b>'+(o?'<s>'+money(p.compare)+'</s> <span class="tag sale" style="position:static">-'+o+'% OFF</span>':'')+'</div>'+
    '<div class="paylist">'+
      ((S.pay.methods||[]).length ? '<div>Pagás con '+esc(S.pay.methods.join(" o ").toLowerCase())+'.</div>' : '')+
      (S.pay.cash ? '<div class="cash">'+money(cashPrice(p))+' pagando en efectivo ('+esc(S.pay.cash)+'% off)</div>' : '')+
      (S.pay.transfer ? '<div>'+money(p.price*(1-S.pay.transfer/100))+' con transferencia ('+esc(S.pay.transfer)+'% off)</div>' : '')+
      (n>1 ? '<div class="cuo" style="font-size:14px">'+n+' cuotas sin interés de '+money2(p.price/n)+'</div>' : '')+
      (S.pay.freeShip ? '<div class="cuo" style="font-size:14px">Envío gratis superando '+money(S.pay.freeShip)+'</div>' : '')+
    '</div>'+
    (p.desc ? '<p class="desc">'+esc(p.desc)+'</p>' : '')+
    '<button class="big" id="mAdd"'+(p.stock?'':' disabled style="background:var(--line);color:var(--muted)"')+'>'+(p.stock?'Agregar al carrito':'Sin stock')+'</button>'+
    (waNum() ? '<a class="big wa2" target="_blank" rel="noopener" href="'+esc(waLink("Hola! Quería consultar por el "+p.name+" ("+money(p.price)+")."))+'">Consultar por WhatsApp</a>' : '')+
  '</div></div></div>');
  if (p.stock) $("#mAdd").onclick = function(){ addToCart(p.id); closeLayer(); };
}

/* ---------- cart ---------- */
function cartItems(){ return cart.map(function(c){ return {c:c, p:S.products.find(function(x){ return x.id===c.id; })}; }).filter(function(x){ return x.p; }); }
function updateCount(){ var n = cartItems().reduce(function(a,x){ return a + x.c.q; }, 0); $("#cCount").textContent = n; }
function addToCart(id){
  var c = cart.find(function(x){ return x.id===id; });
  if (c) c.q++; else cart.push({id:id, q:1});
  saveCart(); updateCount(); toast("Agregado al carrito");
}
function openCart(){
  var items = cartItems(), total = items.reduce(function(a,x){ return a + x.p.price*x.c.q; }, 0);
  var fs = Number(S.pay.freeShip)||0;
  var body = items.length ? items.map(function(x){
    return '<div class="citem"><div class="th">'+pImg(x.p)+'</div><div style="min-width:0"><div class="pname" style="margin:0">'+esc(x.p.name)+'</div><div class="cuo">'+money(x.p.price)+'</div>'+
      '<div class="qty"><button data-dq="'+esc(x.p.id)+'" aria-label="Restar">−</button><span>'+x.c.q+'</span><button data-iq="'+esc(x.p.id)+'" aria-label="Sumar">+</button></div></div>'+
      '<b style="font-variant-numeric:tabular-nums">'+money(x.p.price*x.c.q)+'</b></div>';
  }).join("") : '<p class="empty">El carrito está vacío.</p>';
  var shipMsg = !items.length || !fs ? "" : (total >= fs ? '<div class="cash">¡Tenés envío gratis!</div>' : '<div class="cuo" style="font-size:14px">Te faltan '+money(fs-total)+' para el envío gratis.</div>');
  var msg = "Hola! Quiero hacer este pedido:\n" + items.map(function(x){ return "• "+x.c.q+" x "+x.p.name+" ("+money(x.p.price)+")"; }).join("\n") + "\nTotal: "+money(total);
  layer('<aside class="drawer r" role="dialog" aria-label="Carrito"><div class="dhead"><h3>Carrito</h3><button class="x" aria-label="Cerrar">&times;</button></div><div class="dbody">'+body+'</div>'+
    (items.length ? '<div class="dfoot">'+shipMsg+'<div class="tot"><span>Total</span><span>'+money(total)+'</span></div>'+
      (S.pay.cash ? '<div class="cash">'+money(total*(1-S.pay.cash/100))+' pagando en efectivo</div>' : '')+
      (waNum() ? '<a class="big wa2" target="_blank" rel="noopener" href="'+esc(waLink(msg))+'">Enviar pedido por WhatsApp</a>' : '<p class="cuo">Para cerrar el pedido, escribinos por Instagram.</p>')+
      '<button class="ghost" id="cClear">Vaciar carrito</button></div>' : '')+
  '</aside>');
  document.querySelectorAll("[data-iq],[data-dq]").forEach(function(b){ b.onclick = function(){
    var id = b.dataset.iq || b.dataset.dq, c = cart.find(function(x){ return x.id===id; }); if (!c) return;
    c.q += b.dataset.iq ? 1 : -1; if (c.q<=0) cart = cart.filter(function(x){ return x!==c; });
    saveCart(); updateCount(); openCart();
  }; });
  var cl = $("#cClear"); if (cl) cl.onclick = function(){ cart = []; saveCart(); updateCount(); openCart(); };
}

/* ---------- datos (los edita Marcos desde Pages CMS) ---------- */
var DIALS = [["#101418","#9aa0a6"],["#1d3d6b","#9aa0a6"],["#efe7d4","#6b4529"],["#2f4a32","#5b5a3e"],["#d8c393","#c9a24d"],["#0e0e0e","#222222"],["#344a2a","#9aa0a6"],["#f4f4f2","#1b1b1b"]];
function num(v){ var n = Number(String(v == null ? "" : v).replace(/[^\d.,-]/g,"").replace(/\./g,"").replace(",", ".")); return isFinite(n) ? n : 0; }
function list(v){ return Array.isArray(v) ? v.filter(function(x){ return x != null && String(x).trim() !== ""; }) : []; }
function fromFiles(c, prods, hero){
  c = c || {};
  var marcas = list(c.marcas);
  return {
    brand:{name:c.nombre_tienda || "WATCHES BY MARCOS", tagline:c.frase || "", logo:null, accent:c.color_acento || "#b8995a"},
    promos:list(c.barra_promos), band:list(c.franja),
    hero:(hero||[]).filter(function(h){ return h && (h.titulo || h.foto); }).map(function(h, i){
      var b = h.boton || ""; if (b === "Sin botón") b = "";
      return {title:h.titulo || "", subtitle:h.subtitulo || "", image:h.foto || null, dial:["#3f5a3a","#ece6d8","#1d3d6b","#14181d"][i%4], link:b};
    }),
    pay:{methods:list(c.medios_pago), cash:num(c.descuento_efectivo), transfer:num(c.descuento_transferencia), cuotas:num(c.cuotas), freeShip:num(c.envio_gratis_desde)},
    contact:{whatsapp:c.whatsapp || "", phone:c.telefono || "", instagram:c.instagram || "", email:c.email || "", address:c.direccion || "", hours:c.horarios || ""},
    benefits:(c.beneficios||[]).map(function(b){ return {t:(b&&b.titulo)||"", d:(b&&b.detalle)||""}; }),
    sectionTitle:c.titulo_seccion || "RELOJES", categories:marcas,
    products:(prods||[]).filter(function(p){ return p && p.nombre; }).map(function(p, i){
      var d = DIALS[i % DIALS.length];
      return {id:"p"+i, name:p.nombre, cat:p.marca || "Otros", price:num(p.precio), compare:num(p.precio_anterior), desc:p.descripcion || "", image:p.foto || null, dial:d[0], strap:d[1], stock:p.hay_stock !== false, example:!!p.ejemplo, chrono:/crono/i.test(p.nombre)};
    })
  };
}
function getJSON(u){ return fetch(u + "?v=" + Date.now(), {cache:"no-store"}).then(function(r){ if (!r.ok) throw new Error(u); return r.json(); }); }

/* ---------- arranque ---------- */
shell();
$("#grid").innerHTML = '<p class="empty">Cargando relojes…</p>';
Promise.all([getJSON("data/config.json"), getJSON("data/productos.json"), getJSON("data/portada.json")])
.then(function(r){ S = fromFiles(r[0], r[1], r[2]); renderAll(); })
.catch(function(){ renderAll(); $("#grid").innerHTML = '<p class="empty">No pudimos cargar los relojes. Recargá la página o escribinos por WhatsApp.</p>'; });
setInterval(tick, 1000);
setInterval(function(){ if ((S.hero||[]).length>1 && !document.hidden && Date.now()-lastSwipe > 8000) go(view.slide+1); }, 6000);
})();
</script>
